<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appel AMD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{/* ===== COULEURS AMD : modifier ici ===== */--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e3e7ee;--acc:#e72123;--acc2:#111111;--ok:#1e8e4e;--okbg:#e5f5ec;--ko:#c0392b;--kobg:#fdeceb;--warn:#d98a00;--warnbg:#fff4dc}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--mut:#93a0b3;--line:#2b3441;--okbg:#14301f;--kobg:#3a1a18;--warnbg:#3a2d0c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;border-bottom:4px solid var(--acc);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.logo{height:44px;width:auto;border-radius:50%;background:#fff}
.cnt{white-space:nowrap}
#login .logo{height:110px;display:block;margin:0 auto 14px}
#sync{font-size:12px;opacity:.95}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font-size:14px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700;border-top:3px solid var(--acc);padding-top:9px}
button.btn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:var(--ko)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.stu{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.stu:last-child{border:0}
.stu .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none}
.stu.p{background:var(--okbg)}.stu.p .box{background:var(--ok);border-color:var(--ok)}
.stu.a .box{background:none}
.stu small{color:var(--mut)}
.badge{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-ko{background:var(--kobg);color:var(--ko)}.b-w{background:var(--warnbg);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right}
.bar{height:8px;background:var(--kobg);border-radius:4px;min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.mut{color:var(--mut)}
.big{font-size:26px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats>div{flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.hide{display:none!important}
#login{max-width:360px;margin:60px auto;padding:0 14px}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--ko);font-size:14px;margin:6px 0}
#banner{background:var(--warnbg);color:var(--warn);padding:8px 14px;font-size:14px}
.scroll{overflow-x:auto}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px;align-items:start}
.wr{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.wr.cur{background:var(--warnbg);border-radius:8px}
.wd{min-width:76px;color:var(--mut);font-size:14px}
textarea{resize:vertical}
@media(max-width:800px){.split{grid-template-columns:1fr}.split .right{order:-1}}
</style>
</head>

    <h1>Appel AMD</h1>
    <span id="sync">…</span>
  </header>
  <div id="banner" class="hide"></div>
  <main>
    <div class="chips" id="groupchips"></div>
    <div id="view" style="margin-top:12px"></div>
  </main>
  <nav>
    <button data-t="appel" class="on">✅ Appel</button>
    <button data-t="recap">📊 Récap</button>
    <button data-t="eleves">👥 Élèves</button>
    <button data-t="donnees">💾 Données</button>
  </nav>
</div>

<script>
/* ------------------------------ état ------------------------------ */
let sb=null,user=null;
let store={groups:[],rosters:{},sessions:{},calendar:null};   // sessions[gid][date]={marks,theme}
let pending={};                                 // key -> value|null (null = suppression) en attente d'envoi
let leftTab='jour',tab='appel',gid=null,date=todayISO(),season=null,recapGroup='*',sortBy='abs';
let saveTimers={};

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seasonOf(iso){const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=9?y:y-1}
function seasonLabel(s){return s+'-'+(s+1)}
function fmt(iso){const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y.slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(id){return document.getElementById(id)}
function fullName(s){return (s.nom+' '+s.prenom).trim()}
function uid(p){return p+Math.random().toString(36).slice(2,8)}

/* ------------------------------ démarrage ------------------------------ */
function cfg(){return {url:SUPABASE_URL||localStorage.getItem('amd_url')||'',key:SUPABASE_ANON_KEY||localStorage.getItem('amd_key')||''}}
function saveCfg(){localStorage.setItem('amd_url',$('cfgurl').value.trim());localStorage.setItem('amd_key',$('cfgkey').value.trim());location.reload()}
function showFatal(msg){
  $('app').classList.add('hide');$('login').classList.remove('hide');$('cfgbox').classList.add('hide');
  $('loginbox').innerHTML='<div class="card"><b>La page n\'a pas pu démarrer.</b><p class="err">'+esc(msg)+'</p><p class="mut">Vérifie ta connexion internet, désactive un éventuel bloqueur de publicités pour ce site, puis recharge la page.</p></div>';
}
async function ensureLib(){
  if(window.supabase&&window.supabase.createClient)return true;
  for(const u of ['https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js']){
    try{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});if(window.supabase&&window.supabase.createClient)return true}catch(e){}
  }
  return false;
}
async function init(){
  if(!(await ensureLib())){showFatal('Impossible de charger la bibliothèque Supabase (réseau ou bloqueur).');return}
  const c=cfg();
  if(!c.url||!c.key){$('login').classList.remove('hide');$('cfgbox').classList.remove('hide');$('loginbox').classList.add('hide');return}
  sb=supabase.createClient(c.url,c.key);
  const {data}=await sb.auth.getSession();
  if(data.session){user=data.session.user;start()}else{$('login').classList.remove('hide')}
}
async function login(){
  $('loginerr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:SHARED_EMAIL,password:$('pw').value});
  if(error){$('loginerr').textContent='Connexion refusée ('+(error.message||'erreur')+').';return}
  if($('nm').value.trim())localStorage.setItem('amd_name',$('nm').value.trim());
  user=data.user;$('login').classList.add('hide');start();
}
async function logout(){await sb.auth.signOut();location.reload()}
$('pw')&&$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function start(){
  $('login').classList.add('hide');$('app').classList.remove('hide');
  await load(true);
  setInterval(()=>load(false),20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)});
  setInterval(retryPending,8000);
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
  window.addEventListener('beforeunload',e=>{if(Object.keys(pending).length){e.preventDefault();e.returnValue=''}});
}

/* ------------------------------ données ------------------------------ */
function who(){return localStorage.getItem('amd_name')||'?'}
function setSync(t,bad){const e=$('sync');e.textContent=t;e.style.fontWeight=bad?'700':'400'}
async function load(first){
  const {data,error}=await sb.from('amd_kv').select('key,value');
  if(error){setSync('⚠ Hors ligne',true);return}
  const st={groups:[],rosters:{},sessions:{},calendar:store.calendar};
  const apply=(key,value)=>{
    if(key==='groups')st.groups=(value&&value.list)||[];
    else if(key==='calendar')st.calendar=value;
    else if(key.startsWith('roster:'))st.rosters[key.slice(7)]=value;
    else if(key.startsWith('session:')){const [,g,d]=key.split(':');(st.sessions[g]=st.sessions[g]||{})[d]=value}
  };
  data.forEach(r=>apply(r.key,r.value));
  // les modifications locales non envoyées restent prioritaires
  const removeFromStore=key=>{if(key.startsWith('session:')){const [,g,d]=key.split(':');if(st.sessions[g])delete st.sessions[g][d]}};
  Object.entries(pending).forEach(([k,v])=>v===null?removeFromStore(k):apply(k,v));
  st.groups.sort((a,b)=>a.order-b.order);
  store=st;
  if(!gid||!store.groups.find(g=>g.id===gid))gid=store.groups[0]?.id||null;
  if(!Object.keys(pending).length)setSync('✓ Synchronisé');
  if(first||!document.activeElement||!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))render();
  checkBackupBanner();
}
async function push(key,value){
  pending[key]=value;setSync('Enregistrement…');
  try{
    let res;
    if(value===null)res=await sb.from('amd_kv').delete().eq('key',key);
    else res=await sb.from('amd_kv').upsert({key,value,updated_by:who(),updated_at:new Date().toISOString()});
    if(res.error)throw res.error;
    if(pending[key]===value)delete pending[key];
    if(!Object.keys(pending).length)setSync('✓ Enregistré');
  }catch(e){setSync('⚠ Non envoyé — nouvel essai…',true)}
}
function retryPending(){Object.entries({...pending}).forEach(([k,v])=>push(k,v))}
function pushSoon(key,value){clearTimeout(saveTimers[key]);pending[key]=value;setSync('Enregistrement…');saveTimers[key]=setTimeout(()=>push(key,value),350)}

/* ------------------------------ aides modèle ------------------------------ */
function roster(g){return (store.rosters[g]&&store.rosters[g].students)||[]}
function activeStudents(g){return roster(g).filter(s=>!s.archive)}
function sessionsOf(g){return store.sessions[g]||{}}
function hasMarks(s){return !!s&&Object.keys(s.marks||{}).length>0}
function seasonsAvailable(){
  const set=new Set([seasonOf(todayISO())]);
  Object.values(store.sessions).forEach(o=>Object.keys(o).forEach(d=>set.add(seasonOf(d))));
  return [...set].sort((a,b)=>b-a);
}
function stats(g,seas){
  // par élève : présences/absences sur la saison
  const ses=sessionsOf(g),dates=Object.keys(ses).filter(d=>seasonOf(d)===seas&&hasMarks(ses[d])).sort();
  const map={};
  roster(g).forEach(s=>map[s.id]={s,p:0,a:0});
  dates.forEach(d=>{const m=ses[d].marks||{};Object.entries(m).forEach(([id,v])=>{if(!map[id])return;v==='P'?map[id].p++:map[id].a++})});
  const rows=Object.values(map).filter(r=>r.p+r.a>0||!r.s.archive);
  return {dates,rows};
}

/* ------------------------------ calendrier prévu ------------------------------ */
function closedOn(iso){return ((store.calendar&&store.calendar.closures)||[]).find(c=>iso>=c.from&&iso<=c.to)}
function plannedDates(g){
  // dates prévues (jours du groupe, hors vacances) entre calendar.start et calendar.end
  const c=store.calendar;if(!c||!g.days||!g.days.length)return [];
  const out=[];const d=new Date(c.start+'T12:00:00'),end=new Date(c.end+'T12:00:00');
  while(d<=end){const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(g.days.includes(d.getDay())&&!closedOn(iso))out.push(iso);d.setDate(d.getDate()+1)}
  return out;
}
const JOURS=['dim','lun','mar','mer','jeu','ven','sam'];
function fmtJ(iso){return JOURS[new Date(iso+'T12:00:00').getDay()]+' '+fmt(iso).slice(0,5)}

/* ------------------------------ rendu ------------------------------ */
function render(){
  renderChips();
  const v=$('view');
  if(!store.groups.length&&tab!=='donnees'){v.innerHTML='<div class="card">Aucun groupe pour le moment. Va dans <b>Données</b> pour importer le fichier de départ, ou dans <b>Élèves</b> pour créer un groupe.</div>';if(tab==='eleves')renderEleves();return}
  ({appel:renderAppel,recap:renderRecap,eleves:renderEleves,donnees:renderDonnees})[tab]();
}
function renderChips(){
  const showAll=tab==='recap';
  $('groupchips').classList.toggle('hide',tab==='donnees');
  let h='';
  if(showAll)h+=`<button class="chip ${recapGroup==='*'?'on':''}" onclick="recapGroup='*';render()">Tous</button>`;
  store.groups.forEach(g=>{const on=showAll?recapGroup===g.id:gid===g.id;h+=`<button class="chip ${on?'on':''}" onclick="pickGroup('${g.id}')">${esc(g.name)}</button>`});
  $('groupchips').innerHTML=h;
}
function pickGroup(id){if(tab==='recap')recapGroup=id;gid=id;date=todayISO();render()}

/* ---- Appel ---- */
function renderAppel(){
  const g=store.groups.find(x=>x.id===gid);if(!g)return;
  const ses=sessionsOf(gid),cur=ses[date];
  const marks=(cur&&cur.marks)||{};
  let list=activeStudents(gid);
  // élèves archivés mais déjà notés ce jour-là
  roster(gid).filter(s=>s.archive&&marks[s.id]).forEach(s=>list.push(s));
  const nP=list.filter(s=>marks[s.id]==='P').length;
  const cnt={};stats(gid,seasonOf(date)).rows.forEach(r=>cnt[r.s.id]=r);
  const today=todayISO(),planned=plannedDates(g);
  const todo=planned.filter(d=>d<today&&!hasMarks(ses[d])).slice(-4);   // séances passées non saisies
  const next=planned.filter(d=>d>=today).slice(0,6);                      // prochaines séances
  let h=`<div class="card"><div class="row">
    <input type="date" id="dt" value="${date}" onchange="date=this.value;render()">
    <span class="sp"></span>
    <span class="badge ${hasMarks(cur)?'b-ok':'b-w'}">${hasMarks(cur)?'Appel enregistré':'Pas encore d\'appel'}</span></div>`;
  const chip=(d,cls)=>`<button class="chip ${d===date?'on':''}" ${cls&&d!==date?`style="border-color:${cls}"`:''} onclick="date='${d}';render()">${fmtJ(d)}</button>`;
  if(todo.length)h+=`<div class="mut" style="margin-top:8px;font-size:13px">⚠ À saisir</div><div class="chips">${todo.map(d=>chip(d,'var(--warn)')).join('')}</div>`;
  if(next.length)h+=`<div class="mut" style="margin-top:8px;font-size:13px">Prochaines séances</div><div class="chips">${next.map(d=>chip(d,'')).join('')}</div>`;
  if(closedOn(date))h+=`<div class="badge b-w" style="margin-top:8px">📅 ${esc(closedOn(date).label)} — pas de séance prévue ce jour</div>`;
  h+=`</div><div class="split"><div class="left">${leftPanel(cur)}</div><div class="right"><div class="card"><div class="row" style="margin-bottom:6px"><b>${esc(g.name)}</b><span class="sp"></span><span class="big" style="font-size:20px">${nP} / ${list.length}</span> présents</div><div class="mut" style="font-size:12px;margin-bottom:4px">Compteurs : saison ${seasonLabel(seasonOf(date))}, appels enregistrés</div>`;
  if(!list.length)h+='<div class="mut">Aucun élève dans ce groupe — ajoute-en dans l\'onglet Élèves.</div>';
  list.forEach(s=>{const p=marks[s.id]==='P';
    h+=`<div class="stu ${p?'p':'a'}" onclick="toggle('${s.id}')"><div class="box">${p?'✓':''}</div><div><b>${esc(s.nom)}</b> ${esc(s.prenom)}${s.note?` <small>· ${esc(s.note)}</small>`:''}${s.archive?' <small>(archivé)</small>':''}</div><span class="sp"></span><div class="cnt"><span class="badge b-ok">${(cnt[s.id]||{p:0}).p} prés.</span> <span class="badge b-ko">${(cnt[s.id]||{a:0}).a} abs.</span></div></div>`});
  h+=`</div><div class="card"><div class="row"><button class="btn" onclick="setAll('P')">Tous présents</button><button class="btn" onclick="setAll('A')">Tout décocher</button><span class="sp"></span>${cur?'<button class="btn d" onclick="delSession()">Supprimer cet appel</button>':''}</div></div></div></div>`;
  $('view').innerHTML=h;
}
function leftPanel(cur){
  const ses=sessionsOf(gid),sea=seasonOf(date);
  const all=Object.keys(ses).filter(d=>seasonOf(d)===sea&&(hasMarks(ses[d])||ses[d].theme)).sort().reverse();
  const nDone=all.filter(d=>hasMarks(ses[d])).length;
  const tb=(k,l)=>`<button class="chip ${leftTab===k?'on':''}" onclick="leftTab='${k}';render()">${l}</button>`;
  let h=`<div class="card"><div class="chips" style="margin-bottom:10px">${tb('jour','✏️ Travail du jour')}${tb('hist','📚 Séances effectuées ('+nDone+')')}</div>`;
  if(leftTab==='jour'){
    const prev=all.filter(d=>d<date&&ses[d].theme).slice(0,5);
    h+=`<div class="mut" style="font-size:13px;margin-bottom:4px">Travail effectué le ${fmtJ(date)}</div><textarea id="theme" rows="3" style="width:100%" placeholder="Ex. : Tai otoshi, enchaînements…" oninput="setTheme(this.value)">${esc((cur&&cur.theme)||'')}</textarea>`;
    if(prev.length)h+=`<div class="mut" style="font-size:13px;margin:12px 0 2px">Séances précédentes</div>`+prev.map(workRow).join('');
  }else{
    h+=all.length?all.map(workRow).join(''):'<div class="mut">Aucune séance enregistrée cette saison.</div>';
  }
  return h+'</div>';
}
function workRow(d){
  const s=sessionsOf(gid)[d],m=Object.values((s&&s.marks)||{}),p=m.filter(x=>x==='P').length;
  return `<div class="wr ${d===date?'cur':''}" onclick="date='${d}';render()"><div class="wd">${fmtJ(d)}</div><div class="sp">${s.theme?esc(s.theme):'<span class="mut">—</span>'}</div>${m.length?`<span class="badge ${p/m.length>=0.7?'b-ok':'b-w'}">${p}/${m.length}</span>`:''}</div>`;
}
function ensureSession(){
  const ses=(store.sessions[gid]=store.sessions[gid]||{});
  if(!ses[date])ses[date]={marks:{}};
  if(!hasMarks(ses[date])){const marks={};activeStudents(gid).forEach(s=>marks[s.id]='A');ses[date].marks=marks}
  return ses[date];
}
function saveSession(){const s=store.sessions[gid][date];pushSoon(`session:${gid}:${date}`,JSON.parse(JSON.stringify(s)))}
function toggle(id){const s=ensureSession();s.marks[id]=s.marks[id]==='P'?'A':'P';saveSession();renderAppel()}
function setAll(v){const s=ensureSession();activeStudents(gid).forEach(x=>s.marks[x.id]=v);saveSession();renderAppel()}
function setTheme(t){
  const ses=(store.sessions[gid]=store.sessions[gid]||{});
  const s=(ses[date]=ses[date]||{marks:{}});
  s.theme=t.trim();if(!s.theme)delete s.theme;
  if(!hasMarks(s)&&!s.theme){delete ses[date];pushSoon(`session:${gid}:${date}`,null);return}
  saveSession();
}
function delSession(){if(!confirm('Supprimer l\'appel du '+fmt(date)+' pour ce groupe ?'))return;delete store.sessions[gid][date];push(`session:${gid}:${date}`,null);renderAppel()}

/* ---- Récap ---- */
function renderRecap(){
  const seasons=seasonsAvailable();if(!season||!seasons.includes(season))season=seasons[0];
  let h=`<div class="card row"><label>Saison</label><select onchange="season=+this.value;render()">${seasons.map(s=>`<option value="${s}" ${s===season?'selected':''}>${seasonLabel(s)}</option>`).join('')}</select><span class="sp"></span><button class="btn" onclick="exportRecapCSV()">Exporter CSV</button></div>`;
  if(recapGroup==='*'){
    let tp=0,ta=0,tn=0;
    let rows=store.groups.map(g=>{const {dates,rows}=stats(g.id,season);const p=rows.reduce((a,r)=>a+r.p,0),a=rows.reduce((x,r)=>x+r.a,0);tp+=p;ta+=a;tn+=dates.length;return {g,n:dates.length,p,a,eff:rows.filter(r=>!r.s.archive).length}});
    h+=`<div class="card"><div class="stats"><div><div class="big">${tn}</div><span class="mut">séances</span></div><div><div class="big" style="color:var(--ok)">${tp}</div><span class="mut">présences</span></div><div><div class="big" style="color:var(--ko)">${ta}</div><span class="mut">absences</span></div><div><div class="big">${tp+ta?Math.round(100*tp/(tp+ta)):0}%</div><span class="mut">taux de présence</span></div></div></div>
    <div class="card scroll"><table><tr><th>Groupe</th><th class="n">Élèves</th><th class="n">Séances</th><th class="n">Présences</th><th class="n">Absences</th><th class="n">Taux</th></tr>
    ${rows.map(r=>`<tr onclick="recapGroup='${r.g.id}';render()" style="cursor:pointer"><td>${esc(r.g.name)}</td><td class="n">${r.eff}</td><td class="n">${r.n}</td><td class="n">${r.p}</td><td class="n">${r.a}</td><td class="n">${r.p+r.a?Math.round(100*r.p/(r.p+r.a))+'%':'–'}</td></tr>`).join('')}</table></div>`;
  }else{
    const g=store.groups.find(x=>x.id===recapGroup);if(!g){recapGroup='*';return renderRecap()}
    const {dates,rows}=stats(g.id,season);
    const tp=rows.reduce((a,r)=>a+r.p,0),ta=rows.reduce((a,r)=>a+r.a,0);
    const ses0=sessionsOf(g.id),pl=plannedDates(g).filter(d=>seasonOf(d)===season),plLeft=pl.filter(d=>!hasMarks(ses0[d]));
    rows.forEach(r=>r.t=r.p+r.a);
    rows.sort((x,y)=>sortBy==='abs'?y.a-x.a||x.s.nom.localeCompare(y.s.nom):sortBy==='pres'?y.p-x.p:sortBy==='pct'?((x.t?x.p/x.t:1)-(y.t?y.p/y.t:1)):fullName(x.s).localeCompare(fullName(y.s)));
    h+=`<div class="card"><div class="stats"><div><div class="big">${dates.length}</div><span class="mut">séances faites</span></div><div><div class="big">${plLeft.filter(d=>d>=todayISO()).length}</div><span class="mut">à venir (prévues)</span></div><div><div class="big" style="color:var(--ok)">${tp}</div><span class="mut">présences</span></div><div><div class="big" style="color:var(--ko)">${ta}</div><span class="mut">absences</span></div><div><div class="big">${tp+ta?Math.round(100*tp/(tp+ta)):0}%</div><span class="mut">taux</span></div></div></div>
    <div class="card scroll"><table><tr><th onclick="sortBy='nom';render()">Élève</th><th class="n" onclick="sortBy='pres';render()">Prés.</th><th class="n" onclick="sortBy='abs';render()">Abs.</th><th onclick="sortBy='pct';render()">Assiduité</th></tr>
    ${rows.map(r=>{const pct=r.t?Math.round(100*r.p/r.t):0;return `<tr><td>${esc(r.s.nom)} ${esc(r.s.prenom)}${r.s.archive?' <small class="mut">(archivé)</small>':''}</td><td class="n">${r.p}</td><td class="n">${r.a}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar sp"><i style="width:${pct}%"></i></div><span class="badge ${pct>=80?'b-ok':pct>=60?'b-w':'b-ko'}">${r.t?pct+'%':'–'}</span></div></td></tr>`}).join('')}</table></div>
    <div class="card scroll"><b>Séances</b><table style="margin-top:6px"><tr><th>Date</th><th class="n">Prés.</th><th class="n">Abs.</th><th>Travail effectué</th></tr>
    ${[...new Set([...dates,...plLeft,...Object.keys(ses0).filter(d=>seasonOf(d)===season)])].sort().reverse().map(d=>{const s=ses0[d],m=Object.values((s&&s.marks)||{});if(!m.length)return `<tr class="mut"><td>${fmtJ(d)}</td><td class="n">–</td><td class="n">–</td><td>${s&&s.theme?esc(s.theme):(d<todayISO()?'appel non saisi':'à venir')}</td></tr>`;return `<tr><td>${fmtJ(d)}</td><td class="n">${m.filter(x=>x==='P').length}</td><td class="n">${m.filter(x=>x==='A').length}</td><td>${esc(s.theme||'')}</td></tr>`}).join('')}</table></div>`;
  }
  $('view').innerHTML=h;
}
function exportRecapCSV(){
  const lines=[['Groupe','Nom','Prénom','Présences','Absences','Séances','Taux %']];
  store.groups.filter(g=>recapGroup==='*'||g.id===recapGroup).forEach(g=>{stats(g.id,season).rows.forEach(r=>{const t=r.p+r.a;lines.push([g.name,r.s.nom,r.s.prenom,r.p,r.a,t,t?Math.round(100*r.p/t):''])})});
  download(`recap-${seasonLabel(season)}.csv`,'﻿'+lines.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
}

/* ---- Élèves ---- */
function renderEleves(){
  let h='';
  const g=store.groups.find(x=>x.id===gid);
  if(g){
    h+=`<div class="card"><div class="row"><b>${esc(g.name)}</b><span class="sp"></span><button class="btn" onclick="renameGroup()">Renommer</button></div>
    <div class="row" style="margin-top:10px"><span class="mut">Jours d'entraînement :</span>${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" ${(g.days||[]).includes(d)?'checked':''} onchange="setDay(${d},this.checked)"> ${JOURS[d]}</label>`).join(' ')}</div></div>
    <div class="card"><b>Élèves</b>`;
    const all=roster(gid).slice().sort((a,b)=>(a.archive-b.archive)||a.nom.localeCompare(b.nom)||a.prenom.localeCompare(b.prenom));
    all.forEach(s=>{h+=`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="sp ${s.archive?'mut':''}"><b>${esc(s.nom)}</b> ${esc(s.prenom)}${s.naissance?` <small class="mut">· ${fmt(s.naissance)}</small>`:''}${s.note?` <small class="mut">· ${esc(s.note)}</small>`:''}${s.archive?' <small>(archivé)</small>':''}</div>
      <button class="btn" onclick="editStu('${s.id}')">Modifier</button><button class="btn" onclick="archStu('${s.id}')">${s.archive?'Réactiver':'Archiver'}</button></div>`});
    h+=`</div><div class="card"><b>Ajouter un élève</b><div class="row" style="margin-top:8px"><input id="nn" placeholder="NOM"><input id="np" placeholder="Prénom"><input id="nb" type="date" title="Date de naissance"><input id="nt" placeholder="Note (ceinture…)"><button class="btn p" onclick="addStu()">Ajouter</button></div></div>`;
  }
  h+=`<div class="card"><b>Nouveau groupe</b><div class="row" style="margin-top:8px"><input id="ng" placeholder="Nom du groupe"><button class="btn p" onclick="addGroup()">Créer</button></div></div>`;
  $('view').innerHTML=h;
}
function saveRoster(){push('roster:'+gid,JSON.parse(JSON.stringify(store.rosters[gid])))}
function addStu(){
  const nom=$('nn').value.trim().toUpperCase(),prenom=$('np').value.trim();if(!nom&&!prenom)return;
  const r=(store.rosters[gid]=store.rosters[gid]||{students:[]});
  r.students.push({id:uid('s'),nom,prenom,naissance:$('nb').value,note:$('nt').value.trim(),archive:false});saveRoster();renderEleves();
}
function editStu(id){
  const s=roster(gid).find(x=>x.id===id);
  const nom=prompt('Nom',s.nom);if(nom===null)return;
  const prenom=prompt('Prénom',s.prenom);if(prenom===null)return;
  const note=prompt('Note (ceinture, foyer…)',s.note||'');if(note===null)return;
  const nais=prompt('Date de naissance (AAAA-MM-JJ, vide si inconnue)',s.naissance||'');if(nais===null)return;
  Object.assign(s,{nom:nom.trim().toUpperCase(),prenom:prenom.trim(),note:note.trim(),naissance:nais.trim()});saveRoster();renderEleves();
}
function archStu(id){const s=roster(gid).find(x=>x.id===id);s.archive=!s.archive;saveRoster();renderEleves()}
function addGroup(){
  const name=$('ng').value.trim();if(!name)return;
  const id=name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid('g');
  if(store.groups.find(g=>g.id===id)){alert('Ce groupe existe déjà');return}
  store.groups.push({id,name,order:store.groups.length});store.rosters[id]={students:[]};gid=id;
  push('groups',{list:store.groups});push('roster:'+id,{students:[]});render();
}
function setDay(d,on){const g=store.groups.find(x=>x.id===gid);const s=new Set(g.days||[]);on?s.add(d):s.delete(d);g.days=[...s].sort();push('groups',{list:store.groups})}
function renameGroup(){const g=store.groups.find(x=>x.id===gid);const n=prompt('Nouveau nom',g.name);if(!n||!n.trim())return;g.name=n.trim();push('groups',{list:store.groups});render()}

/* ---- Données ---- */
function renderDonnees(){
  const last=localStorage.getItem('amd_lastexport');
  $('view').innerHTML=`<div class="card"><b>Sauvegarde</b><p class="mut">Connecté en tant que ${esc(who())}. Dernière sauvegarde téléchargée : ${last?new Date(+last).toLocaleDateString('fr-FR'):'jamais'}.<br>Le serveur garde aussi un instantané automatique toutes les 6 h pendant 45 jours.</p>
   <div class="row"><button class="btn p" onclick="exportJSON()">Télécharger la sauvegarde (JSON)</button><button class="btn" onclick="exportAllCSV()">Toutes les présences (CSV)</button></div></div>
   <div class="card"><b>Importer un fichier</b><p class="mut">Sauvegarde ou fichier de départ. Les éléments du fichier remplacent ceux qui ont la même clé (même groupe / même date).</p>
   <input type="file" accept=".json" onchange="importJSON(this.files[0])"></div>
   ${calendarCard()}
   <div class="card"><button class="btn" onclick="load(false)">Actualiser maintenant</button> <button class="btn d" onclick="logout()">Se déconnecter</button></div>`;
}
function calendarCard(){
  const c=store.calendar||{start:todayISO(),end:season?season+1+'-06-30':'',closures:[]};
  return `<div class="card"><b>Calendrier des séances</b><p class="mut">Les dates prévues de chaque groupe sont calculées avec ses jours d'entraînement (onglet Élèves), entre ces deux dates, hors vacances et jours fériés ci-dessous.</p>
  <div class="row"><label>Du</label><input type="date" value="${c.start}" onchange="setCal('start',this.value)"><label>au</label><input type="date" value="${c.end}" onchange="setCal('end',this.value)"></div>
  <div style="margin-top:10px">${(c.closures||[]).slice().sort((a,b)=>a.from.localeCompare(b.from)).map((x,i)=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="sp">${esc(x.label)} <small class="mut">· ${x.from===x.to?fmt(x.from):fmt(x.from)+' → '+fmt(x.to)}</small></span><button class="btn d" onclick="delClosure('${x.from}','${x.to}')">Retirer</button></div>`).join('')||'<span class="mut">Aucune fermeture</span>'}</div>
  <div class="row" style="margin-top:10px"><input id="cl" placeholder="Libellé (ex. Vacances)" style="flex:1"><input type="date" id="cf"><input type="date" id="ct"><button class="btn p" onclick="addClosure()">Ajouter</button></div></div>`;
}
function saveCal(){push('calendar',JSON.parse(JSON.stringify(store.calendar)))}
function setCal(k,v){if(!store.calendar)store.calendar={start:todayISO(),end:todayISO(),closures:[]};store.calendar[k]=v;saveCal()}
function addClosure(){const l=$('cl').value.trim(),f=$('cf').value,t=$('ct').value||f;if(!l||!f)return;if(!store.calendar)store.calendar={start:todayISO(),end:todayISO(),closures:[]};store.calendar.closures.push({from:f,to:t,label:l});saveCal();renderDonnees()}
function delClosure(f,t){store.calendar.closures=store.calendar.closures.filter(x=>!(x.from===f&&x.to===t));saveCal();renderDonnees()}
function snapshotItems(){
  const items=[{key:'groups',value:{list:store.groups}}];
  if(store.calendar)items.push({key:'calendar',value:store.calendar});
  Object.entries(store.rosters).forEach(([g,v])=>items.push({key:'roster:'+g,value:v}));
  Object.entries(store.sessions).forEach(([g,o])=>Object.entries(o).forEach(([d,v])=>items.push({key:`session:${g}:${d}`,value:v})));
  return items;
}
function exportJSON(){download('sauvegarde-appel-amd-'+todayISO()+'.json',JSON.stringify({version:1,items:snapshotItems()},null,1),'application/json');localStorage.setItem('amd_lastexport',Date.now());checkBackupBanner()}
function exportAllCSV(){
  const L=[['Groupe','Date','Nom','Prénom','Statut']];
  store.groups.forEach(g=>{const ses=sessionsOf(g.id);Object.keys(ses).sort().forEach(d=>Object.entries(ses[d].marks||{}).forEach(([id,v])=>{const s=roster(g.id).find(x=>x.id===id);if(s)L.push([g.name,d,s.nom,s.prenom,v==='P'?'Présent':'Absent'])}))});
  download('presences-amd.csv','﻿'+L.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
}
async function importJSON(f){
  if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){alert('Fichier illisible');return}
  if(!d.items||!Array.isArray(d.items)){alert('Format non reconnu');return}
  if(!confirm(d.items.length+' éléments vont être importés (groupes, listes, appels). Continuer ?'))return;
  setSync('Import…');
  const rows=d.items.map(i=>({key:i.key,value:i.value,updated_by:who(),updated_at:new Date().toISOString()}));
  for(let i=0;i<rows.length;i+=50){const {error}=await sb.from('amd_kv').upsert(rows.slice(i,i+50));if(error){alert('Erreur : '+error.message);setSync('⚠ Import incomplet',true);return}}
  await load(true);alert('Import terminé.');
}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function checkBackupBanner(){
  const b=$('banner'),last=+localStorage.getItem('amd_lastexport')||0;
